# XcodeGen spec: `brew install xcodegen && cd apps/ios && xcodegen`
# generates DisplayAnything.xcodeproj (not committed).
name: DisplayAnything
options:
  bundleIdPrefix: com.JC
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone and iPad
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # The Rust core ships an arm64-only simulator slice (Apple silicon Macs).
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Base.xcconfig
  Release: Base.xcconfig
# The Rust core is built by its own aggregate target: as a script phase inside
# the app target, its xcframework output fed back into the same target and
# Xcode reported a dependency cycle.
aggregateTargets:
  ClientCore:
    buildScripts:
      - name: Build the client core (Rust)
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$HOME/.cargo/bin:/opt/homebrew/opt/rustup/bin:$PATH"
          "$SRCROOT/../../scripts/build-ios.sh"
        outputFiles:
          - $(SRCROOT)/../../target/ios/DAMobile.xcframework/Info.plist
targets:
  DisplayAnything:
    type: application
    platform: iOS
    sources:
      - path: DisplayAnything
    dependencies:
      - target: ClientCore
      - framework: ../../target/ios/DAMobile.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.JC.DisplayAnything
        PRODUCT_NAME: DisplayAnything
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "4"
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    info:
      path: DisplayAnything/Info.plist
      properties:
        CFBundleDisplayName: DisplayAnything
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: "DisplayAnything connects to your computers on this network."
        NSBonjourServices:
          - _displayanything._tcp
