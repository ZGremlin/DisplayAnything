name: Publish release (one-off)

on:
  push:
    branches: [claude/project-thread-ij21t9]

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v0.1.0-4dbf18c
      SHA: 4dbf18cfeee43fc968469c4d6a25029fe7fb3241
      RUN_ID: "45825650760"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download CI artifacts from main
        run: |
          mkdir -p dl
          gh run download "$RUN_ID" -D dl
          git show "$SHA:scripts/DisplayAnythingInstall.sh" > dl/DisplayAnythingInstall.sh
          find dl -type f -exec ls -l {} \;
      - name: Create release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "exists"; exit 0; fi
          gh release create "$TAG" --target "$SHA" \
            --title "DisplayAnything 0.1.0 (4dbf18c)" \
            --notes-file .github/release/v0.1.0-4dbf18c.md \
            --latest \
            $(find dl -type f)
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[] | .name + " " + (.size|tostring))'
