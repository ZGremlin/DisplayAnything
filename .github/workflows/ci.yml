name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# A new push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages for the tray app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Build release binaries
        run: cargo build --workspace --release

  package:
    name: package ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - name: Install Tauri CLI (prebuilt)
        run: cargo binstall tauri-cli --version "^2" --no-confirm
      - name: Build installer
        working-directory: apps/tray/src-tauri
        run: cargo tauri build --bundles ${{ matrix.bundles }}
      - name: Build agent
        run: cargo build --release -p da-agent
      - name: Collect (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir out
          cp target/release/bundle/nsis/*.exe out/
          cp target/release/da-agent.exe out/
      - name: Collect (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir out
          # ditto keeps the app's permissions and symlinks intact
          ditto -c -k --keepParent target/release/bundle/macos/DisplayAnything.app out/DisplayAnything-macOS.zip
          # zip strips the executable bit, so ship the CLI in a tarball
          tar -czf out/da-agent-macos.tar.gz -C target/release da-agent
      - uses: actions/upload-artifact@v4
        with:
          name: DisplayAnything-${{ runner.os }}
          path: out/*
