[package]
name = "da-input"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Keyboard and mouse capture, injection and wire format for DisplayAnything"

[dependencies]
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
tokio = { workspace = true }
arboard = { version = "3", default-features = false, features = ["image-data"] }
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
] }
clipboard-win = "5"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24", features = ["highsierra"] }
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSString"] }
