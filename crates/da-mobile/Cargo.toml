[package]
name = "da-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DisplayAnything client core for iPhone and iPad: pairing and the remote screen, exposed to Swift with UniFFI"

[lib]
name = "da_mobile"
crate-type = ["lib", "staticlib"]

[dependencies]
da-core = { path = "../da-core" }
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
# Pinned: the Swift bindings are generated by this exact version.
uniffi = { version = "=0.29.5", features = ["tokio", "cli"] }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
