[package]
name = "da-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
rcgen.workspace = true
spake2.workspace = true
sha2.workspace = true
hmac.workspace = true
rand.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
mdns-sd.workspace = true
tracing.workspace = true
directories.workspace = true
da-input = { path = "../da-input" }
da-screen = { path = "../da-screen" }
socket2 = { version = "0.5", features = ["all"] }
# Local networks' broadcast addresses, for Wake-on-LAN (already used by mdns-sd).
if-addrs = "0.13"

[target.'cfg(unix)'.dependencies]
# getifaddrs, to read this computer's hardware address for Wake-on-LAN.
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
